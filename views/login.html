{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 mt-5 glass-card rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="bg-primary-subtle rounded-circle d-inline-flex p-3 mb-3 text-primary shadow-sm">
                        <i class="fa-solid fa-right-to-bracket fa-2x"></i>
                    </div>
                    <h2 class="fw-bold text-gradient">Welcome Back</h2>
                    <p class="text-muted">Login to continue tracking your expenses</p>
                </div>
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control rounded-3" id="username" name="username" placeholder="Username" required>
                        <label for="username"><i class="fa-regular fa-user me-2"></i>Username</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control rounded-3" id="password" name="password" placeholder="Password" required>
                        <label for="password"><i class="fa-solid fa-lock me-2"></i>Password</label>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-pill shadow-glow">Login</button>
                    </div>
                </form>
                <div class="text-center mt-4">
                    <p class="mb-0 text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold text-accent hover-scale d-inline-block">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
