{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="d-flex align-items-center mb-4 mt-2">
            <a href="{{ url_for('dashboard') }}" class="btn btn-sm btn-light shadow-sm rounded-circle me-3"><i class="fa-solid fa-arrow-left"></i></a>
            <h3 class="fw-bold m-0 text-gradient">Edit Expense</h3>
        </div>
        
        <div class="card shadow-lg border-0 glass-card rounded-4">
            <div class="card-body p-5">
                <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}">
                    <div class="mb-4">
                        <label for="title" class="form-label fw-semibold text-muted small text-uppercase tracking-wide">Expense Title</label>
                        <input type="text" class="form-control form-control-lg rounded-3 border-0 bg-light" id="title" name="title" value="{{ expense.title }}" required>
                    </div>
                    
                    <div class="row mb-4">
                        <div class="col-md-6 mb-4 mb-md-0">
                            <label for="amount" class="form-label fw-semibold text-muted small text-uppercase tracking-wide">Amount ($)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text border-0 bg-light rounded-start-3"><i class="fa-solid fa-dollar-sign text-secondary"></i></span>
                                <input type="number" step="0.01" min="0.01" class="form-control border-0 bg-light rounded-end-3" id="amount" name="amount" value="{{ expense.amount }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="date" class="form-label fw-semibold text-muted small text-uppercase tracking-wide">Date</label>
                            <input type="date" class="form-control form-control-lg rounded-3 border-0 bg-light" id="date" name="date" value="{{ expense.date.strftime('%Y-%m-%d') }}" required>
                        </div>
                    </div>
                    
                    <div class="mb-5">
                        <label for="category" class="form-label fw-semibold text-muted small text-uppercase tracking-wide">Category</label>
                        <select class="form-select form-select-lg rounded-3 border-0 bg-light" id="category" name="category" required>
                            <option value="Food & Dining" {% if expense.category == 'Food & Dining' %}selected{% endif %}>Food & Dining</option>
                            <option value="Housing & Rent" {% if expense.category == 'Housing & Rent' %}selected{% endif %}>Housing & Rent</option>
                            <option value="Transportation" {% if expense.category == 'Transportation' %}selected{% endif %}>Transportation</option>
                            <option value="Utilities" {% if expense.category == 'Utilities' %}selected{% endif %}>Utilities</option>
                            <option value="Entertainment" {% if expense.category == 'Entertainment' %}selected{% endif %}>Entertainment</option>
                            <option value="Shopping" {% if expense.category == 'Shopping' %}selected{% endif %}>Shopping</option>
                            <option value="Healthcare" {% if expense.category == 'Healthcare' %}selected{% endif %}>Healthcare</option>
                            <option value="Travel" {% if expense.category == 'Travel' %}selected{% endif %}>Travel</option>
                            <option value="Other" {% if expense.category == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-pill shadow-glow py-3">Update Expense</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
