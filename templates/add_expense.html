{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm glass-card rounded-4">
            <div class="card-body p-5">
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-primary-subtle rounded-3 p-3 text-primary me-3 shadow-sm">
                        <i class="fa-solid fa-plus fa-xl"></i>
                    </div>
                    <div>
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h2 class="fw-bold m-0">Add Expense</h2>
                                <p class="text-muted small mb-0">Record your new spending activity</p>
                            </div>
                            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
                        </div>
                    </div>
                </div>

                <form method="POST">
                    <div class="mb-4">
                        <label for="title" class="form-label fw-semibold text-muted small text-uppercase tracking-wide">Expense Title</label>
                        <input type="text" class="form-control form-control-lg rounded-3 border-0 bg-light" id="title" name="title" placeholder="e.g. Grocery Shopping" required>
                    </div>
                    
                    <div class="row mb-4">
                        <div class="col-md-6 mb-4 mb-md-0">
                            <label for="amount" class="form-label fw-semibold text-muted small text-uppercase tracking-wide">Amount (INR ₹)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text border-0 bg-light rounded-start-3"><i class="fa-solid fa-indian-rupee-sign text-secondary"></i></span>
                                <input type="number" step="0.01" min="0.01" class="form-control border-0 bg-light rounded-end-3" id="amount" name="amount" placeholder="0.00" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="date" class="form-label fw-semibold text-muted small text-uppercase tracking-wide">Date</label>
                            <input type="date" class="form-control form-control-lg rounded-3 border-0 bg-light" id="date" name="date" required>
                        </div>
                    </div>
                    
                    <div class="mb-5">
                        <label for="category" class="form-label fw-semibold text-muted small text-uppercase tracking-wide">Category</label>
                        <select class="form-select form-select-lg rounded-3 border-0 bg-light" id="category" name="category" required>
                            <option value="" selected disabled>Select Category</option>
                            <option value="Food & Dining">Food & Dining</option>
                            <option value="Housing & Rent">Housing & Rent</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Travel">Travel</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-pill shadow-glow py-3">Add Expense</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Set default date to today
    document.getElementById('date').valueAsDate = new Date();
</script>
{% endblock %}
